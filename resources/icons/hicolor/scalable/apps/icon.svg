<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#1e1e2e" stroke-width="2"/>
  <!-- Disk platter -->
  <ellipse cx="32" cy="34" rx="18" ry="12" fill="#1e1e2e" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="18" ry="12" fill="none" stroke="#e0e0ff" stroke-width="1.5"/>
  <ellipse cx="32" cy="32" rx="12" ry="8" fill="none" stroke="#e0e0ff" stroke-width="1" opacity="0.6"/>
  <ellipse cx="32" cy="32" rx="6" ry="4" fill="none" stroke="#e0e0ff" stroke-width="1" opacity="0.4"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2" fill="#e0e0ff"/>
  <!-- Partition divider lines -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#6C63FF" stroke-width="1.5" opacity="0.8"/>
  <line x1="17" y1="28" x2="47" y2="36" stroke="#6C63FF" stroke-width="1.5" opacity="0.5"/>
</svg>
